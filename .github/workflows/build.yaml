name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.33 kivy

      - name: Build with Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip git zlib1g-dev libffi-dev libssl-dev
          buildozer init
          sed -i 's/# (str) Title of your application/title = Bhatta App/' buildozer.spec
          sed -i 's/# (str) Package name/package.name = bhattaapp/' buildozer.spec
          sed -i 's/# (str) Package domain (needed for android packaging)/package.domain = org.bhatta/' buildozer.spec
          sed -i 's/# (list) Source files (letting it empty will include all files)/source.include_exts = py,png,jpg,kv,atlas/' buildozer.spec
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
          
